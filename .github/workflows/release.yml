name: Release Creator

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version (without v prefix)"
        required: true

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Parse tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" | sed 's/^v//' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: creator-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            asset: creator-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: creator-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: creator-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: pwsh
        run: |
          $binary = if ("${{ runner.os }}".StartsWith("Windows")) { "creator.exe" } else { "creator" }
          $src = "target/${{ matrix.target }}/release/$binary"
          Copy-Item -Path $src -Destination "${{ matrix.asset }}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.setup.outputs.tag }}
          files: ${{ matrix.asset }}

  publish-jsr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2

      - name: Publish to JSR
        working-directory: jsr
        run: deno publish
