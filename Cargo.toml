[package]
name = "creator"
version = "0.0.10"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rayon = "1.12.0"
walkdir = "2.5.0"
regex = "1.12.4"
notify = "8.2.0"
open = "5.3.5"
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "rustls"
] }
grass = "0.13.4"
lightningcss = "1.0.0-alpha.71"
oxc = { version = "0.135.0", features = ["full"] }
base64 = "0.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
