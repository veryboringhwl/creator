[package]
name = "creator"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.12.0"
walkdir = "2.5.0"
regex = "1.12.3"
notify = "8.2.0"
open = "5.3.5"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
grass = "0.13.4"
lightningcss = "1.0.0-alpha.71"
swc_core = { version = "67.0.1", features = ["common", "ecma_ast", "ecma_parser", "ecma_codegen", "ecma_visit", "ecma_transforms", "ecma_transforms_typescript", "ecma_transforms_react"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
